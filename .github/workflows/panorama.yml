name: Panorama

# Torsdag kveld: «Helga i ett sveip», en sømløs Instagram-karusell for helga som kommer (fredag–søndag),
# lagt i et issue (eieren får e-post). Bildene lages av «Oppdater og publiser» (scripts/panorama.py)
# og ligger i denne-helgen/ på nettsiden. Kan også startes for hånd under Actions → Panorama → Run workflow.

on:
  schedule:
    - cron: "47 18 * * 4"   # torsdag, UTC. Vintertid ca. 19:47, sommertid 20:47.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  panorama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lag teksten
        id: post
        run: python3 scripts/panorama.py body.md

      - name: Legg panoramaet i et issue
        if: steps.post.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          # Forrige ukes panorama lukkes, så bare det nyeste er åpent
          for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Helga i ett sveip:\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Erstattet av et nyere panorama."
          done
          # Tildeles eieren, så GitHub sender varsel på e-post uten at repoet må følges
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md --assignee "$GITHUB_REPOSITORY_OWNER"
