name: Oppdater og publiser

on:
  schedule:
    # Hver andre time på dagtid, så «Utsolgt» og «Få billetter igjen» er ferske. Et "rolig" minutt, fordi GitHub
    # av og til hopper over kjøringer rett på hel/halv time; en kjøring som faller bort, tas igjen to timer senere.
    # Det committes og publiseres bare når programmet er endret.
    # UTC. Vintertid: ca. 06:17, 08:17 … 22:17 (sommertid: en time senere).
    - cron: "17 5-21/2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent program fra Tikkio og Parken
        id: sync
        if: github.event_name != 'push'
        env:
          SYNC_WARNINGS: ${{ runner.temp }}/sync-warnings.md
        run: |
          python3 scripts/sync.py
          if [ -s "$SYNC_WARNINGS" ]; then echo "warnings=true" >> "$GITHUB_OUTPUT"; fi

      # Kinoprogrammet (ODEON Ålesund via Filmweb) ligger adskilt fra resten og stopper aldri oppdateringen
      - name: Hent kinoprogram
        if: github.event_name != 'push'
        env:
          SYNC_WARNINGS: ${{ runner.temp }}/sync-warnings.md
        run: |
          python3 scripts/kino.py
          if [ -s "$SYNC_WARNINGS" ]; then echo "warnings=true" >> "$GITHUB_OUTPUT"; fi
        id: kino

      - name: Lagre endringer
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/kino.json
          # En kjøring som venter i køen sjekker ut main slik den var da kjøringen ble opprettet. Hent derfor siste main før push
          # (ellers avvises pushen når en annen kjøring har lagret imens). -X theirs: ved konflikt i data-filene vinner de ferskeste dataene fra denne kjøringen.
          git diff --cached --quiet || (git commit -m "Oppdater program" && git pull --rebase -X theirs origin main && git push)

      # Undersider (kategorier, i dag, helgen, scener, hvert arrangement) og sitemap lages på nytt ved hver publisering
      # Helgebildet (denne-helgen/helgen.png) og delingsbildene (arrangement/<id>/deling.jpg) trenger Pillow og sidens skrifter. Uten dem brukes DejaVu, eller bildet hoppes over.
      - name: Hent Pillow og skrifter til helgebildet
        continue-on-error: true
        run: |
          pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/BricolageGrotesque.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/bricolagegrotesque/BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf"
          curl -fsSL -o "$RUNNER_TEMP/fonts/Figtree.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/Figtree%5Bwght%5D.ttf"
          curl -fsSL -o "$RUNNER_TEMP/fonts/JetBrainsMono.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"

      - name: Lag undersider
        env:
          FONT_DIR: ${{ runner.temp }}/fonts
        run: python3 scripts/pages.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # Gi Bing m.fl. beskjed om sidene som endrer seg (IndexNow). Feil her stopper ikke noe.
      - name: Si fra til søkemotorer
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/indexnow.py

      # Varsling: ett åpent issue samler problemene (GitHub sender e-post til eieren).
      # Det lukkes automatisk neste gang alt går fint.
      - name: Varsle om problemer
        if: always() && github.event_name != 'push' && (failure() || steps.sync.outputs.warnings == 'true' || steps.kino.outputs.warnings == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_WARNINGS: ${{ runner.temp }}/sync-warnings.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ job.status != 'success' }}
        run: |
          {
            if [ "$FAILED" = "true" ]; then
              echo "Oppdateringen feilet, så siden viser fortsatt programmet fra forrige vellykkede kjøring."
              echo
            fi
            if [ -s "$SYNC_WARNINGS" ]; then cat "$SYNC_WARNINGS"; echo; fi
            echo "Logg: $RUN_URL"
          } > body.md
          title="Programoppdateringen trenger tilsyn"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            # Kjører hver andre time: ikke ny kommentar (og e-post) når problemet er det samme som sist
            last=$(gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '(.comments | last | .body) // .body')
            if [ "$(grep -v '^Logg:' body.md)" = "$(printf '%s\n' "$last" | grep -v '^Logg:')" ]; then
              echo "Samme problem som sist, ingen ny kommentar."
            else
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
            fi
          else
            # Tildeles eieren, så GitHub sender e-post (også om nye kommentarer) uten at repoet må følges
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Lukk varsel når alt er i orden igjen
        if: success() && github.event_name != 'push' && steps.sync.outputs.warnings != 'true' && steps.kino.outputs.warnings != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Programoppdateringen trenger tilsyn"
          for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Oppdateringen gikk fint igjen, så jeg lukker dette."
          done
