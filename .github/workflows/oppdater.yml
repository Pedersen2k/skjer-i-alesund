name: Oppdater og publiser

on:
  schedule:
    # GitHub bruker UTC og kan starte 10–30 min forsinket.
    # Vintertid: ca. 06:50 og 20:50 (sommertid: 07:50 og 21:50).
    - cron: "50 5 * * *"    # morgen
    - cron: "50 19 * * *"   # kveld
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent program fra Tikkio og Parken
        id: sync
        if: github.event_name != 'push'
        env:
          SYNC_WARNINGS: ${{ runner.temp }}/sync-warnings.md
        run: |
          python3 scripts/sync.py
          if [ -s "$SYNC_WARNINGS" ]; then echo "warnings=true" >> "$GITHUB_OUTPUT"; fi

      - name: Lagre endringer
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || (git commit -m "Oppdater program" && git push)

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5

      # Varsling: ett åpent issue samler problemene (GitHub sender e-post til eieren).
      # Det lukkes automatisk neste gang alt går fint.
      - name: Varsle om problemer
        if: always() && github.event_name != 'push' && (failure() || steps.sync.outputs.warnings == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_WARNINGS: ${{ runner.temp }}/sync-warnings.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ job.status != 'success' }}
        run: |
          {
            if [ "$FAILED" = "true" ]; then
              echo "Den daglige oppdateringen feilet, så siden viser fortsatt programmet fra forrige vellykkede kjøring."
              echo
            fi
            if [ -s "$SYNC_WARNINGS" ]; then cat "$SYNC_WARNINGS"; echo; fi
            echo "Logg: $RUN_URL"
          } > body.md
          title="Programoppdateringen trenger tilsyn"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

      - name: Lukk varsel når alt er i orden igjen
        if: success() && github.event_name != 'push' && steps.sync.outputs.warnings != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Programoppdateringen trenger tilsyn"
          for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Oppdateringen gikk fint i dag igjen, så jeg lukker dette."
          done
