name: Ukepost

# To faste Instagram-karuseller, lagt i hvert sitt issue (eieren får e-post):
# søndag ettermiddag «Under hundrelappen» (gratis og billig hele neste uke),
# mandag morgen «Uka i Ålesund» (ett tips per dag mandag–torsdag, pluss dagsbilder til historien).
# Bildene lages av «Oppdater og publiser» og ligger i uka/ på nettsiden.
# Kan også startes for hånd under Actions → Ukepost → Run workflow.

on:
  schedule:
    - cron: "43 14 * * 0"   # søndag, UTC. Vintertid ca. 15:43, sommertid 16:43.
    - cron: "43 5 * * 1"    # mandag, UTC. Vintertid ca. 06:43, sommertid 07:43.
  workflow_dispatch:
    inputs:
      post:
        description: "Hvilken post"
        type: choice
        options: [billig, uka]
        default: billig

permissions:
  contents: read
  issues: write

jobs:
  ukepost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lag teksten
        id: post
        env:
          KIND: ${{ inputs.post || (github.event.schedule == '43 5 * * 1' && 'uka' || 'billig') }}
        run: |
          python3 scripts/ukepost.py "$KIND" body.md
          echo "prefix=$([ "$KIND" = uka ] && echo 'Uka i Ålesund:' || echo 'Under hundrelappen:')" >> "$GITHUB_OUTPUT"

      - name: Legg posten i et issue
        if: steps.post.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.post.outputs.title }}
          PREFIX: ${{ steps.post.outputs.prefix }}
        run: |
          # Forrige ukes post av samme slag lukkes, så bare den nyeste er åpen
          for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$PREFIX\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Erstattet av en nyere post."
          done
          # Tildeles eieren, så GitHub sender varsel på e-post uten at repoet må følges
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md --assignee "$GITHUB_REPOSITORY_OWNER"
