*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding:28px 16px 56px}
.page{max-width:1100px;margin:0 auto;display:grid;gap:28px}

const CL={konsert:"Konsert",standup:"Standup",show:"Show",barn:"Barn & familie",klubb:"Klubb",happening:"Happening",sport:"Sport"};

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dt=s=>new Date(s+"T12:00");const add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};

const leg=`<div class="leg">${Object.entries(CL).map(([k,l])=>`<span><i style="--c:var(--c-${k})"></i>${l}</span>`).join("")}</div>`;

document.getElementById("cat").innerHTML+=Object.entries(CL).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
const subSeg=()=>`<div class="seg2"><button data-s="mnd" class="${sub=="mnd"?"on":""}">Måned</button><button data-s="uke" class="${sub=="uke"?"on":""}">Uke</button></div>`;
function month(){const first=m+"-01",gs=wst(first),dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),n=Math.ceil((mon0(first)+dim)/7)*7,cells=[];
 for(let i=0;i<n;i++){const s=add(gs,i),es=on(s);
  const dots=es.slice(0,4).map(e=>`<i style="--c:var(--c-${e.cat})"></i>`).join("")+(es.length>4?`<em>+${es.length-4}</em>`:"");
  cells.push(`<div class="cell ${s.startsWith(m)?"":"out"} ${s<TODAY?"past":""} ${s===TODAY?"today":""} ${s===sel?"sel":""}" data-d="${s}">${dt(s).getDate()}<div class="d">${dots}</div></div>`)}
 const es=on(sel);
 return `<div class="nav"><button data-m="-1">‹</button><b>${MON[+m.slice(5)-1]} ${m.slice(0,4)}</b><button data-m="1">›</button></div><div class="wdh">${["man","tir","ons","tor","fre","lør","søn"].map(x=>`<span>${x}</span>`).join("")}</div><div class="mg">${cells.join("")}</div>${leg}<div class="sh">${longDay(sel)}<small>${es.length} arrangement${es.length==1?"":"er"}</small></div>${es.length?es.map(card).join(""):'<div class="empty">Ingenting registrert denne dagen.</div>'}<button class="more" data-wk="${sel}">Se hele uka (uke ${wnum(sel)}) →</button>`}
function week(){const rows=[...Array(7)].map((_,i)=>{const s=add(w,i),es=on(s),d=dt(s);
  return `<div class="wk ${s===TODAY?"today":""}"><div class="dt">${WD[d.getDay()]}<b>${d.getDate()}</b>${MON[d.getMonth()].slice(0,3)}</div><div>${es.length?es.map(e=>`<div class="mini" style="--c:var(--c-${e.cat})"><i>${e.time||"hele dagen"}</i><div><b>${e.title}</b><small>${e.venue}${e.price?" · "+e.price:""}</small></div></div>`).join(""):'<div class="none">Ingenting</div>'}</div></div>`}).join("");
 return `<div class="nav"><button data-w="-7">‹</button><div style="text-align:center"><b>Uke ${wnum(w)}</b><br><span style="font:500 10.5px var(--fm);color:var(--muted)">${dt(w).getDate()}. – ${dt(add(w,6)).getDate()}. ${MON[dt(add(w,6)).getMonth()]}</span></div><button data-w="7">›</button></div>${w!==wst(TODAY)?'<div style="text-align:center"><button class="today-btn" data-w="0">← Tilbake til denne uka</button></div>':""}${rows}${leg}`}
function list(){const days=[...new Set(EV.filter(e=>e.date>=TODAY&&(!cat||e.cat===cat)).map(e=>e.date))].slice(0,30);
 return `<div class="lst">${days.map(s=>{const d=dt(s);return `<div class="day"><div class="date">${WD[d.getDay()]}<b>${d.getDate()}</b>${MON[d.getMonth()].slice(0,3)}</div><div>${on(s).map(card).join("")}</div></div>`}).join("")}</div>`}
function draw(){const y=scrollY;document.querySelectorAll("#main button").forEach(b=>b.classList.toggle("on",b.dataset.v===main));
