7:30", "title": "Juleshow på Løvenvold Vol. 4", "venue": "Løvenvold Theater", "cat": "standup", "price": "699 kr", "min": 699}, {"date": "2026-12-19", "time": "16:00", "title": "Darling West – juleturné", "venue": "Løvenvold Theater", "cat": "konsert", "price": "520 kr", "min": 520}, {"date": "2026-12-26", "time": "20:00", "title": "Romjulsdans med Steinar Engelbrektson og Sissel Lunde Sundby", "venue": "Quality Hotel Ålesund", "cat": "happening", "price": "380 kr", "min": 380}];const TODAY="2026-10-26";

const groups=(()=>{const m=new Map();EV.forEach(e=>{const k=e.title+"|"+e.venue;if(!m.has(k))m.set(k,{...e,dates:[]});m.get(k).dates.push(e)});return [...m.values()]})();
const range=g=>g.dates.length===1?f(g.date)+(g.time?" kl. "+g.time:""):`${g.dates.length} datoer · ${f(g.dates[0].date)} – ${f(g.dates.at(-1).date)}`;

const mk=(k,t,d,how,init)=>{const o=document.createElement("div");o.className="opt "+k;o.innerHTML=`<h2><span class="k">${k}</span>${t}</h2><div class="phone"><div class="sc"></div></div><p>${d}</p><div class="how"><b>Slik lages den:</b> ${how}</div>`;document.getElementById("g").appendChild(o);const sc=o.querySelector(".sc");init(sc);sc.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){b.nextElementSibling.classList.toggle("on")}})};

mk("A","Nedtelling","Mørkegrønn åpning med snø og en stor nedtelling til julaften. Resten er en rolig liste delt i «før advent», «advent» og «romjul». Gir juleglede med en gang.","Siden bygges av <code>pages.py</code> som de andre sidene. Nedtellingen er ett lite script. Arrangementene hentes fra programmet (tittel med «jul», «advent» eller en merkelapp i <code>manual.json</code>).",sc=>{
 const sec=(t,fn)=>{const g=groups.filter(fn);return g.length?`<h4>${t}</h4>`+g.map(x=>`<div class="c"><span class="d">${range(x)}</span><b>${x.title}</b><small>${x.venue} · ${x.price||"Pris hos arrangør"}</small>${dl(x)}</div>`).join(""):""};
 sc.innerHTML=`<div class="hero snow"><small>Ålesund · 2026</small><h3>Jul i<br>Ålesund</h3><div class="cd"><b>${days}</b><span>dager til<br>julaften</span></div></div><div class="body">${sec("Før advent",g=>g.date<"2026-11-29")}${sec("Advent",g=>g.date>="2026-11-29"&&g.date<"2026-12-20")}${sec("Romjul og nær jul",g=>g.date>="2026-12-20")}</div>`});

 sc.innerHTML=`<div class="top"><small>Ålesund · julen 2026</small><h3>Jul i Ålesund</h3><p>Konserter, show, markeder og verksteder. Alt på ett sted, med billettpriser.</p></div><div class="orn"></div>${sec("Konserter",g=>g.cat==="konsert")}${sec("Show og humor",g=>g.cat==="standup"||g.cat==="show")}${sec("Marked og verksted",g=>g.cat==="happening")}<div style="height:30px"></div>`});

  const by={};es.forEach(e=>(by[e.date]??=[]).push(e));
  const chips=[["konsert","Konsert"],["standup","Standup og show"],["happening","Marked og verksted"]].map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${cats.has(k)}">${l}</button>`).join("")+`<button class="chip" data-p aria-pressed="${cheap}">Under 350 kr</button>`;
  sc.innerHTML=`<div class="hd"><h3>Jul i <span>Ålesund</span></h3><div class="chips">${chips}</div></div><div class="cnt">${es.length} arrangementer</div>`+Object.entries(by).slice(0,40).map(([d,l])=>{const x=dt(d);return `<div class="day"><div class="dt">${WD[x.getDay()]}<b>${x.getDate()}</b>${MON[x.getMonth()]}</div><div>${l.map(e=>`<div class="c" style="--c:${CATC[e.cat]||"#888"}"><b>${e.title}</b><small>${e.venue}${e.time?" · kl. "+e.time:""} · ${e.price||"Pris hos arrangør"}</small></div>`).join("")}</div></div>`}).join("")};
 sc.addEventListener("click",e=>{const c=e.target.closest("[data-c]"),p=e.target.closest("[data-p]");const y=sc.scrollTop;if(c){const k=c.dataset.c;k==="standup"?(cats.has("standup")?(cats.delete("standup"),cats.delete("show")):(cats.add("standup"),cats.add("show"))):(cats.has(k)?cats.delete(k):cats.add(k));draw();sc.scrollTop=y}if(p){cheap=!cheap;draw();sc.scrollTop=y}});draw()});

mk("E","Hva slags jul?","Et spørsmål med store fliser: Julekonsert, Latter og show, Marked og verksted, Billig kos. Trykk og få forslag. Lav terskel, litt lek, og folk blir lenger på siden.","Fliser og noen få regler i script (type og pris), som i filtrene på siden. Ingen gjetting: forslagene er arrangementer som faktisk passer i filteret, uten oppdiktede anbefalinger.",sc=>{
 const T=[["konsert","Julekonsert","Musikk og kor","#b3262d",g=>g.cat==="konsert"],["latter","Latter og show","Standup, show og scene","#1b5a45",g=>g.cat==="standup"||g.cat==="show"],["marked","Marked og verksted","Ting å gjøre sammen","#c98a1b",g=>g.cat==="happening"],["billig","Billig kos","Under 350 kr","#6a4fa3",g=>typeof g.min==="number"&&g.min<=350]];
 let sel="";
 const draw=()=>{const t=T.find(x=>x[0]===sel),res=t?groups.filter(t[4]):[];
  sc.innerHTML=`<div class="hero snow"><small>Jul i Ålesund</small><h3>Hva slags jul<br>har du lyst på?</h3></div><div class="tiles">${T.map(x=>`<button class="tile ${x[0]===sel?"on":""}" data-k="${x[0]}" style="background:${x[3]}">${x[1]}<small>${x[2]}</small></button>`).join("")}</div>`+(t?`<div class="res"><h4>${res.length} forslag: ${t[1].toLowerCase()}</h4>${res.map(g=>`<div class="c"><b>${g.title}</b><small>${range(g)}<br>${g.venue} · ${g.price||"Pris hos arrangør"}</small></div>`).join("")}</div>`:'<div class="res"><div class="c"><small>Velg en flis for å se forslag.</small></div></div>')};
 sc.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b){sel=b.dataset.k===sel?"":b.dataset.k;draw()}});draw()});
