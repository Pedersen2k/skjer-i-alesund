<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Solnedgang fra Aksla – mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#ffd166}
.ns::-webkit-scrollbar{display:none}
@keyframes sun{50%{transform:translateY(-6px)}}
@keyframes shimmer{50%{opacity:.35}}
@keyframes twinkle{50%{opacity:.3}}
@keyframes rise{from{opacity:0;transform:translateX(16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1d0b33; color: #ffffff; font-family: 'DM Sans', system-ui, sans-serif">

<svg aria-hidden="true" viewBox="0 0 780 300" preserveAspectRatio="xMidYMax slice" style="position: absolute; left: 0; top: 60px; width: 390px; height: 300px">
<defs>
<linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d0b33"/><stop offset=".45" stop-color="#5a1a7a"/><stop offset=".7" stop-color="#e0457b"/><stop offset=".88" stop-color="#ff9a4a"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
<linearGradient id="seaC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4a"/><stop offset=".3" stop-color="#7a2470"/><stop offset="1" stop-color="#1d0b33"/></linearGradient>
<pattern id="lightsC" width="12" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#ffe08a"/><circle cx="9" cy="8" r="1" fill="#ffffff"/></pattern>
</defs>
<rect width="780" height="175" fill="url(#skyC)"/>
<circle cx="500" cy="158" r="44" fill="{{accent}}" style="animation: sun 6s ease-in-out infinite"/>
<path d="M0 172L70 128l60 30 80-52 70 44 70-30 80 42 80-22 100 26 100-42 70 28v22Z" fill="#5a1a66"/>
<rect y="172" width="780" height="128" fill="url(#seaC)"/>
<path d="M450 184h100M470 196h60M430 210h140M480 224h44" stroke="#ffe9a8" stroke-width="3" stroke-linecap="round" style="animation: shimmer 3s ease-in-out infinite"/>
<ellipse cx="140" cy="206" rx="190" ry="14" fill="#3a1260"/>
<ellipse cx="690" cy="198" rx="160" ry="10" fill="#4a1a66"/>
<path d="M0 300V246q160-34 340-24 130 8 220 30 50 14 70 48Z" fill="#1d0b33"/>
<path d="M0 300V246q160-34 340-24 130 8 220 30 50 14 70 48Z" fill="url(#lightsC)" style="animation: twinkle 4s ease-in-out infinite"/>
</svg>

<div class="ns" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px">

<div style="height: 56px; box-sizing: border-box; padding: 0 6px 0 10px; border-radius: 28px; border: 1px solid rgba(255,255,255,.3); background: rgba(29,11,51,.5); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" viewBox="0 0 120 120" style="width: 38px; height: 38px"><defs><clipPath id="lgC"><circle cx="60" cy="60" r="58"/></clipPath></defs><g clip-path="url(#lgC)"><rect width="120" height="120" fill="#ff9a5a"/><circle cx="78" cy="50" r="15" fill="#fff1bf"/><path d="M0 62l18-16 14 10 20-22 22 24 16-12 30 18v10H0Z" fill="#8e2f6e"/><rect y="70" width="120" height="50" fill="#4a1a5e"/><path d="M0 120V96q40-14 70-8 22 5 30 32Z" fill="#1d0b33"/></g></svg>
<div style="font: 800 14px Unbounded, sans-serif; letter-spacing: .3px">KA SKJER DA?</div>
</div>
<button aria-label="Søk" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,.16); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4"/></svg></button>
</div>

<h1 style="margin: 4px 0 118px; font: 800 29px/1.15 Unbounded, sans-serif; letter-spacing: -.5px">Byen våkner når sola går ned</h1>

<div role="group" aria-label="Dag" style="display: flex; padding: 4px; gap: 4px; border-radius: 30px; border: 1px solid rgba(255,255,255,.3); background: rgba(29,11,51,.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); flex-shrink: 0">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="4">
<button onClick="{{ d.pick }}" style="flex: 1 1 0; height: 48px; border-radius: 24px; border: 0; background: {{d.bg}}; color: {{d.fg}}; font: 700 12px Unbounded, sans-serif; cursor: pointer; transition: background .25s, color .25s">{{d.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; color: rgba(255,255,255,.85)">Velg så mange du vil</div>
<div role="group" aria-label="Kategorier" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
<button onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid {{c.color}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; gap: 6px; font: 700 14px 'DM Sans', sans-serif; cursor: pointer; transition: background .25s, color .25s">
<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: {{c.checkDisplay}}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{c.label}}
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{ events }}" as="ev" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; animation: rise .5s both">
<div style="width: 52px; flex-shrink: 0; padding-top: 18px; font: 700 12px Unbounded, sans-serif; text-align: right">{{ev.time}}</div>
<div aria-hidden="true" style="width: 12px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center">
<div style="width: 2px; height: 20px; background: rgba(255,255,255,.3)"></div>
<div style="width: 12px; height: 12px; border-radius: 6px; background: {{ev.color}}; box-shadow: 0 0 12px {{ev.color}}"></div>
<div style="width: 2px; flex-grow: 1; background: rgba(255,255,255,.3)"></div>
</div>
<div style="flex: 1 1 0; min-width: 0; margin-bottom: 12px; padding: 14px 10px 14px 16px; border-radius: 24px; border: 1px solid rgba(255,255,255,.26); background: rgba(29,11,51,.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 28px rgba(0,0,0,.3); display: flex; align-items: center; gap: 8px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font: 700 16px/1.25 'DM Sans', sans-serif">{{ev.title}}</div>
<div style="font-size: 13px; color: rgba(255,255,255,.85)">{{ev.venue}}</div>
<div style="font: 700 12px 'DM Sans', sans-serif; color: {{ev.color}}">{{ev.cat}} · {{ev.price}}</div>
</div>
<button onClick="{{ ev.star }}" aria-label="Lagre arrangement" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: rgba(255,255,255,.12); color: #ffd166; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="{{ev.starFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></button>
</div>
</div>
</sc-for>
<p style="display: {{emptyDisplay}}; margin: 0; padding: 24px; text-align: center; border-radius: 24px; border: 1px dashed rgba(255,255,255,.4); font-size: 15px">Ingenting i disse kategoriene denne dagen.</p>
</div>
</div>

<nav aria-label="Hovedmeny" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); height: 72px; padding: 0 10px; border-radius: 36px; border: 1px solid rgba(255,255,255,.3); background: rgba(29,11,51,.6); -webkit-backdrop-filter: blur(28px) saturate(200%); backdrop-filter: blur(28px) saturate(200%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 14px 40px rgba(0,0,0,.5); display: flex; align-items: center; gap: 6px">
<a href="#" aria-label="Utforsk" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22a10 10 0 100-20 10 10 0 000 20zM15.5 8.5l-2 5-5 2 2-5z"/></svg></a>
<a href="#" aria-label="Kalender" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1zM4 10h16M8 3v4M16 3v4"/></svg></a>
<a href="#" style="height: 56px; padding: 0 20px; border-radius: 28px; background: {{accent}}; color: #2a1a00; text-decoration: none; display: flex; align-items: center; gap: 8px; font: 700 13px Unbounded, sans-serif"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>Mine {{savedCount}}</a>
<a href="#" aria-label="Tips oss om et arrangement" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="#" aria-label="Meny" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd166","options":["#ffd166","#ffe9a8","#ffb86b"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { day: '12', on: {}, saved: {} };
renderVals() {
const EV = [
['12','18:00','Bjørn & Bjarte','Show','Løvenvold Theater','699 kr'],
['12','18:00','Julelystenning på Devoldfabrikken','Happening','Devoldfabrikken','pris hos arrangør'],
['12','18:30','Jul på Molja','Show','Thon Hotel Ålesund','pris hos arrangør'],
['12','19:00','Anders Jektvik','Konsert','Parken kulturhus','450 kr'],
['12','Kveld','Pubquiz','Quiz',"O'Connor's",'50 kr'],
['13','18:30','Sofia Emelia & Robert Botn','Konsert','Dråpe Ålesund Kaffehus','150 kr'],
['13','19:00','Christine Koht','Show','Parken kulturhus','450 kr'],
['13','23:00','DJ hver helg','Klubb','Liv & Røre Moa','pris hos arrangør'],
['14','15:00','Vitenshitshow','Barn','Parken kulturhus','320 kr'],
['14','19:00','SULT','Konsert','Venterommet, Terminalen','250 kr'],
['14','23:00','KLUBB E39','Klubb','Terminalen Byscene','50 kr'],
['15','13:00','Lag din egen nisse hos Siws keramikk','Happening','Devoldfabrikken','200 kr'],
['15','18:00','Tonje Glimmerdal','Konsert','Parken kulturhus','utsolgt']
];
const COL = { Konsert: '#5eead4', Show: '#ffb86b', Klubb: '#c4a5ff', Barn: '#ffe08a', Happening: '#ff9db0', Quiz: '#8fd3ff' };
const s = this.state;
const any = Object.values(s.on).some(Boolean);
const list = EV.filter((e) => e[0] === s.day && (!any || s.on[e[3]]));
return {
accent: this.props.accent ?? '#ffd166',
days: [['12', 'TOR 12'], ['13', 'FRE 13'], ['14', 'LØR 14'], ['15', 'SØN 15']].map((d) => ({ label: d[1], pick: () => this.setState({ day: d[0] }), bg: s.day === d[0] ? '#ffd166' : 'transparent', fg: s.day === d[0] ? '#2a1a00' : '#ffffff' })),
cats: Object.keys(COL).map((c) => ({ label: c, color: COL[c], on: !!s.on[c], checkDisplay: s.on[c] ? 'block' : 'none', bg: s.on[c] ? COL[c] : 'rgba(29,11,51,.55)', fg: s.on[c] ? '#1d0b33' : '#ffffff', pick: () => this.setState({ on: { ...s.on, [c]: !s.on[c] } }) })),
events: list.map((e) => {
const k = e[0] + e[2];
return { time: e[1], title: e[2], cat: e[3], venue: e[4], price: e[5], color: COL[e[3]], starFill: s.saved[k] ? '#ffd166' : 'none', star: () => this.setState({ saved: { ...s.saved, [k]: !s.saved[k] } }) };
}),
emptyDisplay: list.length ? 'none' : 'block',
savedCount: String(Object.values(s.saved).filter(Boolean).length)
};
}
}
</script>
</body>
</html>
