<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forslag: kalenderabonnement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#eef3f2;--surface:#fff;--fg:#10282f;--muted:#5a7177;--line:#d3dfdd;--accent:#c8432b;--accent-ink:#fff;--sea:#1f6f78;--shell:#10282f;--soft:#e3eeec;
--c-konsert:#1f6f78;--c-standup:#b5531c;--c-show:#6a4fa3;--c-barn:#2f8a4c;
--fd:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--fb:"Figtree",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0b171b;--surface:#12232a;--fg:#e3eeec;--muted:#8fa6a9;--line:#22383f;--accent:#ec6a4f;--accent-ink:#1a0b07;--sea:#5ab7bf;--shell:#02080a;--soft:#1a2f37;
--c-konsert:#5ab7bf;--c-standup:#f08a4b;--c-show:#ab93e6;--c-barn:#6cc98a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--fb);padding:28px 16px 56px}
.page{max-width:1300px;margin:0 auto;display:grid;gap:28px}
h1{font:800 clamp(28px,6vw,42px)/1 var(--fd);letter-spacing:-.03em;margin:0}h1 span{color:var(--accent)}
.intro{color:var(--muted);max-width:64ch;margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:40px 24px;justify-items:center}
.opt{width:100%;max-width:340px;display:grid;gap:10px;align-content:start}
.opt h2{margin:0;font:800 21px/1.1 var(--fd);letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline}
.opt h2 .k{font:500 12px/1 var(--fm);color:var(--accent);letter-spacing:.08em}
.opt p{margin:0;font-size:13.5px;color:var(--muted)}.opt p b{color:var(--fg);font-weight:600}
.phone{position:relative;height:640px;border:8px solid var(--shell);border-radius:30px;overflow:hidden;background:var(--bg)}
.screen{height:100%;overflow-y:auto;padding:12px 14px 40px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
.eyebrow{font:500 10px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.theme,.pill{font:600 12px/1 var(--fb);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill{color:var(--sea)}.pill svg,.ico{width:14px;height:14px;flex:none}
.pill.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.brand{display:flex;gap:8px;align-items:center;margin:10px 0 4px}.logo{width:28px;height:30px}
.brand b{font:800 25px/1 var(--fd);letter-spacing:-.03em}.brand b span{color:var(--accent)}
.lede{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.ctl{display:grid;gap:7px;padding:8px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.search{font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);width:100%}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dd i{font:normal 500 12px/1 var(--fb);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.count{font:500 10.5px/1 var(--fm);color:var(--muted);display:flex;justify-content:space-between;align-items:center;padding:8px 0 2px}
.day{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.date{font:500 10px/1.1 var(--fm);color:var(--accent);text-transform:uppercase}.date b{display:block;font:800 26px/1 var(--fd);color:var(--fg);margin:2px 0}
.ev{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:grid;gap:1px}
.ev b{font:800 14px/1.2 var(--fd)}.ev small{font-size:11px;color:var(--muted)}.ev u{font:600 11px var(--fb);color:var(--sea);text-decoration:none}
.ev .t{font:500 9.5px/1 var(--fm);color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 var(--fb);padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{font:600 13px/1 var(--fb);padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--sea);cursor:pointer;text-align:center}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 13px;display:grid;gap:9px;margin:4px 0 10px}
.card h3{margin:0;font:800 16px/1.15 var(--fd)}.card p{margin:0;font-size:12.5px;color:var(--muted)}.card .x{justify-self:end;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;margin:-6px -4px -8px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.strip{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:12.5px;cursor:pointer;color:var(--fg)}
.strip svg{color:var(--sea)}.strip em{margin-left:auto;font-style:normal;color:var(--sea);font-weight:600}
.fab{position:absolute;right:12px;bottom:14px;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px #0004;cursor:pointer;transition:.2s;opacity:0;transform:scale(.7);pointer-events:none}
.fab.on{opacity:1;transform:none;pointer-events:auto}.fab svg{width:22px;height:22px}
.bar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;transform:translateY(100%);transition:.25s}
.bar.on{transform:none}.bar span{flex:1;line-height:1.25}
.scrim{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:.2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 14px 18px;display:grid;gap:10px;transform:translateY(105%);transition:.25s;box-shadow:0 -6px 24px #0004}
.sheet.on{transform:none}.sheet h3{margin:0;font:800 17px/1.1 var(--fd)}.sheet p{margin:0;font-size:12.5px;color:var(--muted)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.msg{font-size:12px;color:var(--sea);min-height:1em}
.hint{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 9px}
</style></head><body><div class="page">
<header><h1>Hvor skal <span>kalender-knappen</span> bo?</h1>
<p class="intro">Seks forslag. Rammene er små kopier av forsiden med ekte scrolling og trykk: <b>scroll</b> i rammen, <b>trykk</b> på knappene og se hva som åpner seg. Knappene i arkene gjør ikke noe på ekte her. Datoene og arrangementene er fra programmet.</p></header>
<div class="grid" id="g"></div></div>
<script>
const EV=[{"date": "2026-10-24", "time": "17:30", "title": "50 år med The Beatles", "venue": "Løvenvold Theater", "cat": "konsert", "price": "634 kr"}, {"date": "2026-10-24", "time": "18:30", "title": "Ålesund symfoniorkester – Carmina Burana", "venue": "Parken kulturhus", "cat": "konsert", "price": "130–480 kr"}, {"date": "2026-10-24", "time": "20:00", "title": "Ballinciaga", "venue": "Terminalen Byscene", "cat": "konsert", "price": "425 kr"}, {"date": "2026-10-26", "time": "18:00", "title": "Peter Pan", "venue": "Parken kulturhus", "cat": "barn", "price": "200–300 kr"}, {"date": "2026-10-30", "time": "19:00", "title": "Treretters: En lattergalla", "venue": "Parken kulturhus", "cat": "standup", "price": "530–625 kr"}, {"date": "2026-10-31", "time": "19:00", "title": "Viggo Venneløs", "venue": "Løvenvold Theater", "cat": "standup", "price": "350 kr"}, {"date": "2026-11-03", "time": "19:00", "title": "Tuva & Ronny følger drømmen", "venue": "Parken kulturhus", "cat": "show", "price": "480 kr"}, {"date": "2026-11-05", "time": "18:30", "title": "Juleshow på Løvenvold Vol. 4", "venue": "Løvenvold Theater", "cat": "standup", "price": "699 kr"}, {"date": "2026-11-07", "time": "13:00", "title": "Dyrene i Hakkebakkeskogen", "venue": "Parken kulturhus", "cat": "barn", "price": "465 kr"}, {"date": "2026-11-08", "time": "15:00", "title": "Sans – Piero Issa og Ole Petter Knarvik", "venue": "Parken kulturhus", "cat": "barn", "price": "75–100 kr"}, {"date": "2026-11-12", "time": "18:00", "title": "Bjørn & Bjarte", "venue": "Løvenvold Theater", "cat": "show", "price": "699 kr"}, {"date": "2026-12-01", "time": "17:30", "title": "Nøtteknekkeren", "venue": "Arbeideren kulturhus", "cat": "show", "price": "299 kr"}];
const CAL='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const CATS={alle:"Alt",konsert:"Konserter",standup:"Standup",show:"Show",barn:"Barn og familie"};
const CL={konsert:"Konsert",standup:"Standup",show:"Show",barn:"Barn & familie"};
const WD=["søn","man","tir","ons","tor","fre","lør"],MO=["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const days=()=>{const m={};EV.forEach(e=>(m[e.date]??=[]).push(e));return Object.entries(m)};
const evHtml=e=>`<div class="ev" style="--c:var(--c-${e.cat})"><span class="t">${CL[e.cat]}</span><b>${e.title}</b><small>${e.venue}${e.time?" · kl. "+e.time:""}${e.price?" · "+e.price:""}</small></div>`;
const dayHtml=([d,es])=>{const x=new Date(d+"T12:00");return `<div class="day"><div class="date">${WD[x.getDay()]}<b>${x.getDate()}</b>${MO[x.getMonth()]}</div><div>${es.map(evHtml).join("")}</div></div>`};
const logo='<svg class="logo" viewBox="0 0 48 52"><circle cx="24" cy="6" r="3.5" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M7 44V24h5c0-6 4-10 8-11.5L24 11l4 1.5c4 1.5 8 5.5 8 11.5h5v20Z" fill="var(--accent)"/><circle cx="15" cy="30" r="2" fill="var(--surface)"/><circle cx="33" cy="30" r="2" fill="var(--surface)"/><path d="M4 49c3.5-2.5 6.5-2.5 10 0s6.5 2.5 10 0 6.5-2.5 10 0 6.5 2.5 10 0" fill="none" stroke="var(--sea)" stroke-width="2.5" stroke-linecap="round"/></svg>';
const head=(extra="")=>`<div class="topbar"><div class="eyebrow">62,47° N · 6,15° Ø</div><div class="row">${extra}<span class="theme">◐ Mørk</span></div></div><div class="brand">${logo}<b>Skjer i <span>Ålesund</span></b></div><p class="lede">Konserter, standup, show og happenings i byen, samlet på ett sted.</p>`;
const ctl=(count="")=>`<div class="ctl"><div style="display:grid;grid-template-columns:1fr auto;gap:6px"><div class="search">Søk etter artist, sted eller show …</div><span class="theme">★ Mine</span></div><div class="dd"><i>Når: Alle</i><i>Alle kategorier</i><i>Alle scener</i><i>Alle priser</i></div></div><div class="count"><span>110 arrangementer</span>${count}</div>`;
const sheetHtml=(cat)=>`<div class="grab"></div><h3>Abonner på kalender</h3><p>Nye arrangementer dukker opp av seg selv i mobilkalenderen din.</p><div class="pick">${Object.entries(CATS).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k===cat}">${l}</button>`).join("")}</div><div class="row"><span class="btn p" data-go>Abonner (iPhone/Mac)</span><span class="btn" data-go>Google Kalender</span><span class="btn" data-go>Kopier lenke</span></div><div class="msg"></div>`;
const L=days();
const DESIGNS=[
{k:"A",t:"Knapp i toppen",d:"Liten pille ved siden av mørk/lys-bryteren. Alltid synlig øverst uten å ta plass. Trykk åpner et ark nedenfra.",
 build:()=>({top:head('<span class="pill hot" data-open>'+CAL+'Kalender</span>'),mid:"",lead:"",list:L})},
{k:"B",t:"Stripe under velkomsten",d:"Samme grep som kino-stripen: ett smalt felt rett over filtrene. Synlig for alle uten å skrike.",
 build:()=>({top:head()+`<div class="strip" data-open>${CAL}<span>Få programmet rett i kalenderen din</span><em>Abonner →</em></div>`,list:L})},
{k:"C",t:"Kort midt i lista",d:"Dukker opp etter første helgs program, akkurat når de har sett at siden er nyttig. Kan lukkes med ×.",
 build:()=>({top:head(),inject:{after:2,html:`<div class="card" data-card><button class="x">×</button><h3>Ikke gå glipp av noe</h3><p>La nye arrangementer lande i mobilkalenderen din automatisk. Velg det du bryr deg om:</p><div class="pick">${["konsert","standup","show","barn"].map(k=>`<button class="chip" data-quick="${k}" aria-pressed="false">${CATS[k]}</button>`).join("")}</div><div class="msg"></div></div>`},list:L})},
{k:"D",t:"Følger filteret ditt",d:"Velg «Standup» i filteret og få «Abonner på disse». Mest relevant, siden folk abonnerer på akkurat det de leter etter. Trykk filterknappene under.",
 build:()=>({top:head(),ctlsel:true,list:L})},
{k:"E",t:"Flytende knapp",d:"Rund kalenderknapp nederst til høyre som dukker opp når du har scrollet litt. Alltid for hånden, uansett hvor i lista du er.",
 build:()=>({top:head(),fab:true,list:L})},
{k:"F",t:"Bunnlinje etter scrolling",d:"En smal linje glir opp nederst når du har scrollet en stund: «Liker du programmet? Få det i kalenderen». Kan lukkes. Nesten som en cookie-banner, men nyttig.",
 build:()=>({top:head(),bar:true,list:L})},
];
const g=document.getElementById("g");
DESIGNS.forEach(D=>{
 const b=D.build();let cat="alle";
 const el=document.createElement("div");el.className="opt";
 let list=b.list.map(dayHtml);
 if(b.inject)list.splice(b.inject.after,0,b.inject.html);
 const sel=b.ctlsel?`<div class="pick" data-sel style="margin:8px 0 2px">${["alle","konsert","standup","show","barn"].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${k==="alle"}">${CATS[k]}</button>`).join("")}</div><div class="strip" data-open style="display:none;margin-top:6px">${CAL}<span data-sl></span><em>Abonner →</em></div>`:"";
 el.innerHTML=`<h2><span class="k">${D.k}</span>${D.t}</h2><div class="phone"><div class="screen">${b.top}${ctl()}${sel}<div data-list>${list.join("")}</div></div>
 ${b.fab?`<button class="fab" data-open aria-label="Abonner på kalender">${CAL.replace('class="ico"','')}</button>`:""}
 ${b.bar?`<div class="bar"><span>Liker du programmet? Få det i kalenderen din.</span><span class="btn p" data-open style="padding:9px 12px">Abonner</span><button class="x" style="border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer" data-close-bar>×</button></div>`:""}
 <div class="scrim"></div><div class="sheet"></div></div><p>${D.d}</p>`;
 g.appendChild(el);
 const ph=el.querySelector(".phone"),sc=el.querySelector(".screen"),sheet=el.querySelector(".sheet"),scrim=el.querySelector(".scrim");
 const draw=()=>sheet.innerHTML=sheetHtml(cat);
 const open=()=>{draw();sheet.classList.add("on");scrim.classList.add("on")},close=()=>{sheet.classList.remove("on");scrim.classList.remove("on")};
 scrim.onclick=close;
 ph.addEventListener("click",e=>{
  if(e.target.closest("[data-open]")){open();return}
  const q=e.target.closest("[data-quick]");
  if(q){const m=q.closest(".card").querySelector(".msg");m.textContent="✓ Abonnementet er klart: "+CATS[q.dataset.quick]+" (på ekte åpnes kalenderappen)";q.closest(".pick").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===q));return}
  if(e.target.closest(".card .x")){e.target.closest("[data-card]").remove();return}
  if(e.target.closest("[data-close-bar]")){e.target.closest(".bar").classList.remove("on");return}
  const k=e.target.closest("[data-k]");if(k){cat=k.dataset.k;draw();return}
  const f=e.target.closest("[data-f]");
  if(f){cat=f.dataset.f;el.querySelectorAll("[data-f]").forEach(c=>c.setAttribute("aria-pressed",c===f));
   const s=el.querySelector("[data-sel]+.strip");el.querySelector("[data-list]").innerHTML=L.map(([d,es])=>[d,cat==="alle"?es:es.filter(x=>x.cat===cat)]).filter(x=>x[1].length).map(dayHtml).join("")||'<p class="lede" style="padding:16px 0">Ingen i dette utvalget akkurat nå.</p>';
   s.style.display=cat==="alle"?"none":"flex";s.querySelector("[data-sl]").textContent="Abonner på "+CATS[cat].toLowerCase()+" i kalenderen";return}
  if(e.target.closest("[data-go]")){sheet.querySelector(".msg").textContent="✓ Slik ser det ut på ekte: kalenderappen åpnes med «Abonner på "+CATS[cat].toLowerCase()+"?»"}
 });
 const fab=el.querySelector(".fab"),bar=el.querySelector(".bar");
 sc.addEventListener("scroll",()=>{fab?.classList.toggle("on",sc.scrollTop>220);if(bar&&!bar.dataset.closed)bar.classList.toggle("on",sc.scrollTop>380)},{passive:true});
});
</script></body></html>
