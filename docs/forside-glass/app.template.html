<title>Kaskjerda Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one app, two shapes. Phone = glass top bar + floating glass tab bar + bottom sheets.
   PC = glass top bar with liquid lens, sticky glass filter column, card grid, side panel for details.
   Behind everything: "byens humør", soft colour fields drawn from the categories you are looking at. */
:root{
  color-scheme: dark;
  --bg:#06141a; --bg2:#0b222b; --fg:#eef7f8; --muted:#9fb9be; --faint:#6d8a90;
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.13); --glass-strong:rgba(14,36,44,.62);
  --line:rgba(255,255,255,.16); --line-hi:rgba(255,255,255,.42); --shadow:0 18px 50px -18px rgba(0,0,0,.65);
  --ink-on-accent:#03181d; --accent:#5fe0e6; --now:#7bf0a3; --sold:#ff7a85; --few:#ffc861;
  --k-konsert:#4fd6dd; --k-standup:#ff9256; --k-show:#b994ff; --k-barn:#74e6a0;
  --k-klubb:#ff72b9; --k-happening:#ffd45e; --k-quiz:#93a9ff; --k-sport:#62b4ff; --k-julebord:#ff6b72;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-xl:30px; --r-l:22px; --r-m:16px; --pill:999px;
  --spring:cubic-bezier(.34,1.42,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --mood-alpha:.9;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme: light;
  --bg:#e7f0f1; --bg2:#f6fafa; --fg:#0a2329; --muted:#4b666c; --faint:#6f878c;
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.78);
  --line:rgba(255,255,255,.85); --line-hi:rgba(255,255,255,1); --shadow:0 18px 44px -20px rgba(16,52,60,.35);
  --ink-on-accent:#ffffff; --accent:#0d8790; --now:#13924a; --sold:#c42b3a; --few:#a86400;
  --k-konsert:#0f97a0; --k-standup:#e2631f; --k-show:#7a52d6; --k-barn:#1f9d55;
  --k-klubb:#d23d8c; --k-happening:#c09000; --k-quiz:#4f67e0; --k-sport:#1f72d1; --k-julebord:#cf2f39;
  --mood-alpha:.55;
}}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e7f0f1; --bg2:#f6fafa; --fg:#0a2329; --muted:#4b666c; --faint:#6f878c;
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.78);
  --line:rgba(255,255,255,.85); --line-hi:rgba(255,255,255,1); --shadow:0 18px 44px -20px rgba(16,52,60,.35);
  --ink-on-accent:#ffffff; --accent:#0d8790; --now:#13924a; --sold:#c42b3a; --few:#a86400;
  --k-konsert:#0f97a0; --k-standup:#e2631f; --k-show:#7a52d6; --k-barn:#1f9d55;
  --k-klubb:#d23d8c; --k-happening:#c09000; --k-quiz:#4f67e0; --k-sport:#1f72d1; --k-julebord:#cf2f39;
  --mood-alpha:.55;
}
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage + scroller: the stage is the "screen" (also the phone frame in preview) */
#stage{position:fixed;inset:0;transform:translateZ(0);overflow:hidden;background:var(--bg);container:app / inline-size}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain}
#mood{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:var(--mood-alpha);transition:opacity .6s}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* preview chrome (only on wide windows) */
body.phone{background:radial-gradient(1200px 700px at 30% 20%, var(--bg2), var(--bg))}
body.phone #stage{inset:auto;left:50%;top:50%;width:390px;height:min(844px, calc(100% - 40px));translate:-50% -50%;border-radius:52px;box-shadow:0 0 0 10px #0b0f12,0 0 0 11px rgba(255,255,255,.18),0 40px 120px -30px rgba(0,0,0,.7)}
body.phone #stage::after{content:"";position:absolute;top:10px;left:50%;translate:-50% 0;width:118px;height:32px;border-radius:20px;background:#000;z-index:200;pointer-events:none}
body.phone #scroller{padding-top:44px}
.pvbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:300;display:none;gap:4px;padding:4px;border-radius:var(--pill);background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:var(--shadow)}
.pvbar span{font-size:12px;color:var(--muted);padding:6px 6px 6px 10px}
.pvbar button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--pill)}
.pvbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (min-width:1000px){ .pvbar{display:flex} }

/* ── glass material ── */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--line-hi), inset 0 -10px 24px -18px rgba(255,255,255,.18), var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08));mix-blend-mode:soft-light}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:50;padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:24px;max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:none}
.brand svg{width:30px;height:32px;flex:none}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.topr{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.iconbtn:hover{background:var(--glass-2)}
.iconbtn svg{width:20px;height:20px}
.searchpill{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;border-radius:var(--pill);color:var(--muted);width:min(300px,26cqi);transition:background .2s}
.searchpill:hover{background:var(--glass-2)}
.searchpill svg{width:18px;height:18px;flex:none}
.searchpill span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchpill kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
.minebtn{display:flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:var(--pill);font-weight:700;transition:background .2s,color .2s}
.minebtn svg{width:18px;height:18px}
.minebtn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.minebtn .n{font-variant-numeric:tabular-nums;min-width:1ch}
.minebtn.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}

/* ── segmented control with liquid lens ── */
.seg{position:relative;display:flex;padding:4px;border-radius:var(--pill);background:rgba(0,0,0,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
:root[data-theme="light"] .seg{background:rgba(10,35,41,.07)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .seg{background:rgba(10,35,41,.07)} }
.seg button{position:relative;z-index:1;flex:1;white-space:nowrap;padding:9px 16px;border-radius:var(--pill);font-weight:600;font-size:14px;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--fg)}
.lens{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:var(--pill);
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));border:1px solid var(--line-hi);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 6px 18px -6px rgba(0,0,0,.45);
  backdrop-filter:blur(6px) saturate(200%);-webkit-backdrop-filter:blur(6px) saturate(200%);
  transition:left .55s var(--spring), width .55s var(--spring)}
.lens.go{animation:squish .55s var(--ease)}
@keyframes squish{30%{transform:scaleX(1.12) scaleY(.86)}65%{transform:scaleX(.97) scaleY(1.04)}}
.topseg{flex:none;margin:0 auto}

/* ── page ── */
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 140px}
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:stretch}
.hello{padding:6px 4px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--now);box-shadow:0 0 0 0 var(--now);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 70%,transparent)}80%,100%{box-shadow:0 0 0 10px transparent}}
.hello h1{font:800 clamp(34px,7.4cqi,72px)/.95 var(--display);letter-spacing:-.035em;margin:12px 0 10px;text-wrap:balance}
.hello h1 em{font-style:normal;background:linear-gradient(100deg,var(--k-konsert),var(--k-show) 45%,var(--k-klubb) 75%,var(--k-standup));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 9s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.hello p{margin:0;color:var(--muted);max-width:52ch;font-size:16px}
.hello p b{color:var(--fg);font-variant-numeric:tabular-nums}

/* next up */
.next{border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.next .glowb{position:absolute;width:220px;height:220px;right:-60px;top:-80px;border-radius:50%;background:var(--c);filter:blur(50px);opacity:.55;pointer-events:none}
.next .lab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cd{font:700 13px var(--body);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:var(--pill);background:color-mix(in srgb,var(--now) 18%,transparent);color:var(--now)}
.next h2{font:800 26px/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;position:relative}
.next .meta{color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;position:relative}
.next .meta b{color:var(--fg)}
.next .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--pill);background:var(--fg);color:var(--bg);font-weight:700;text-decoration:none;white-space:nowrap}
.cta svg{width:16px;height:16px}

/* pulse: 7/14 day stacked bars */
.pulse{border-radius:var(--r-xl);padding:16px 14px 12px}
.pulse .ph{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.pulse .ph h3{margin:0;font:700 15px var(--display)}
.pulse .ph span{font-size:12px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 8px;border-radius:16px;transition:background .25s,transform .3s var(--spring)}
.day:hover{background:var(--glass-2)}
.day:active{transform:scale(.94)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"] .cnt{color:var(--bg)}
.bars{height:64px;width:16px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:rgba(127,127,127,.14)}
.bars i{display:block;width:100%;transition:height .6s var(--spring)}
.wd{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dn{font:700 17px/1 var(--display);font-variant-numeric:tabular-nums}
.cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.day.wknd .wd{color:var(--accent)}
.day.today .dn{text-decoration:underline 2px var(--now);text-underline-offset:4px}
.days .more14{display:none}

/* category chips (bubbles) */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 8px;border-radius:var(--pill);font-weight:600;font-size:14px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  transition:background .3s, color .3s, transform .35s var(--spring), box-shadow .3s}
.chip:active{transform:scale(.93)}
.chip .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);transition:background .3s,color .3s}
.chip .ic svg{width:14px;height:14px}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--c);color:var(--ink-on-accent);border-color:transparent;box-shadow:0 8px 24px -8px var(--c)}
.chip[aria-pressed="true"] .ic{background:rgba(255,255,255,.3);color:var(--ink-on-accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip[disabled]{opacity:.4}
.mcats{margin-top:4px}

/* ── main layout ── */
.main{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
.side{display:none}
.filters h4{margin:0 0 10px;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fsec{padding:16px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.fsec:first-of-type{border-top:0;padding-top:4px}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fhead h3{margin:0;font:800 22px var(--display);letter-spacing:-.02em}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent)}
.linkbtn[hidden]{display:none}
/* price */
.pricev{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pricev b{font:800 22px var(--display);font-variant-numeric:tabular-nums}
.pricev span{font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent) var(--p,100%),rgba(127,127,127,.22) var(--p,100%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent) var(--p,100%),rgba(127,127,127,.22) var(--p,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:22px;margin-top:-7px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.65));border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.35);transition:transform .3s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25,1.15)}
input[type=range]::-moz-range-thumb{width:30px;height:22px;border-radius:12px;background:#fff;border:0;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding:0 4px}
/* toggles */
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 0;font-weight:600;text-align:left}
.tgl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sw{flex:none;width:50px;height:30px;border-radius:var(--pill);background:rgba(127,127,127,.3);position:relative;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .4s var(--spring),width .2s}
.tgl:active .sw::after{width:30px}
.tgl[aria-pressed="true"] .sw{background:var(--now)}
.tgl[aria-pressed="true"] .sw::after{left:23px}
.tgl[aria-pressed="true"]:active .sw::after{left:17px}
/* venues */
.venues{display:flex;flex-direction:column;gap:2px}
.venue{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;font-size:14px;transition:background .2s}
.venue:hover{background:var(--glass-2)}
.venue span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.venue[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.venue[aria-pressed="true"] span:last-child{color:inherit}
.jbtile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-l);text-decoration:none;margin-top:6px;--c:var(--k-julebord);overflow:hidden}
.jbtile .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c);flex:none}
.jbtile .ic svg{width:20px;height:20px}
.jbtile b{display:block;font:700 15px var(--display)}
.jbtile small{color:var(--muted)}

/* ── list ── */
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 4px 6px}
.listhead h2{margin:0;font:800 clamp(24px,4cqi,32px) var(--display);letter-spacing:-.02em}
.listhead p{margin:0;color:var(--muted);font-size:14px}
.active{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.ach{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:var(--pill);font-size:13px;font-weight:600;background:var(--glass-2);border:1px solid var(--line)}
.ach svg{width:14px;height:14px;opacity:.7}
.dsec{margin-top:18px}
.dhead{position:sticky;top:var(--stick,80px);z-index:20;display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:var(--pill);margin:0 0 12px;font-weight:700}
.dhead .dd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font:800 15px var(--display);font-variant-numeric:tabular-nums}
.dhead .rel{color:var(--now);font-weight:700}
.dhead .c{color:var(--muted);font-weight:500;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}

/* card */
.card{--c:var(--accent);--mx:80%;--my:0%;border-radius:var(--r-l);padding:14px 14px 14px 16px;display:grid;gap:8px;overflow:hidden;text-align:left;width:100%;cursor:pointer;
  transition:transform .45s var(--spring), box-shadow .3s; animation:rise .6s var(--ease) both; animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.98)}}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.985)}
.card .glowc{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(260px 180px at var(--mx) var(--my), color-mix(in srgb,var(--c) 34%,transparent), transparent 70%);transition:opacity .3s}
.card .edge{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 14px var(--c)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ctag svg{width:14px;height:14px}

  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4v.6M12 17h.01"/>',
  sport:'<circle cx="12" cy="12" r="9"/><path d="m12 7.5 3.8 2.8-1.5 4.4H9.7l-1.5-4.4Z"/>',
  julebord:'<path d="M12 3 6.5 11h3L6 16.5h12L14.5 11h3Z"/><path d="M12 16.5V21"/>'
};
const CAT = { konsert:"Konsert", standup:"Standup", show:"Show", barn:"Barn og familie", klubb:"Klubb", happening:"Happening", quiz:"Quiz", sport:"Sport", julebord:"Julebord" };
const CATORDER = ["konsert","standup","show","klubb","barn","happening","quiz","sport"];
const ic = (c, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICON[c]||ICON.happening}</svg>`;
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1-4.5-4.3 6.1-.8Z"/></svg>';
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

/* ── time (Europe/Oslo, independent of the phone's zone) ── */
const fmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Oslo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function now(){ const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value])); return { date:`${p.year}-${p.month}-${p.day}`, min:+p.hour*60 + +p.minute, hh:p.hour, mm:p.minute }; }
const WD = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
const MO = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const d2 = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = dt => dt.toISOString().slice(0,10);
const add = (s,n) => { const t = d2(s); t.setUTCDate(t.getUTCDate()+n); return iso(t); };
const wday = s => d2(s).getUTCDay();
const dnum = s => +s.slice(8);
const dlong = s => `${WD[wday(s)]} ${dnum(s)}. ${MO[+s.slice(5,7)-1]}`;
const dshort = s => `${WD[wday(s)].slice(0,3)} ${dnum(s)}. ${MO[+s.slice(5,7)-1].slice(0,3)}`;
const toMin = t => t ? (+t.slice(0,2))*60 + +t.slice(3,5) : null;
function relLabel(s, today){ const n = (d2(s)-d2(today))/864e5; return n===0?"I dag":n===1?"I morgen":null; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ── data ── */
const ALL = DATA.map(e => {
  const occ = [[e.date, e.time||""]];
  (e.moreShows||[]).forEach(x => occ.push([x.slice(0,10), x.slice(11,16)]));
  const shows = {}; (e.shows||[]).forEach(([x,st]) => shows[x] = st);
  const price = !e.price || e.price === "Pris hos arrangør" ? null : e.price;
  return { ...e, title: e.title || `${e.home} – ${e.away}`, occ, showSt: shows, priceTxt: price, search: fold([e.title, e.venue, CAT[e.cat], e.note, e.home, e.away].join(" ")) };
});
const JB = ALL.filter(e => e.cat === "julebord");
const EV = ALL.filter(e => e.cat !== "julebord");
function fold(s){ return (s||"").toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").replace(/aa/g,"a").normalize("NFD").replace(/[̀-ͯ]/g,""); }

/* ── state ── */
const favs = new Set(store.get("glass-favs", []));
const state = { when:"uke", day:null, cats:new Set(), max:null, free:false, avail:false, venue:null, mine:false };

function range(){
  const t = now().date;
  if (state.day) return [state.day, state.day];
  switch(state.when){
    case "ikveld": return [t,t];
    case "imorgen": return [add(t,1), add(t,1)];
    case "helg": { const w = wday(t); const fri = w===0 ? add(t,-2) : w===6 ? add(t,-1) : add(t,(5-w+7)%7); return [w>=5||w===0 ? t : fri, add(fri,2)]; }
    case "uke": return [t, add(t,6)];
    default: return [t, "9999"];
  }
}
function firstIn(e, a, b){
  const n = now();
  for (const [d,tm] of e.occ){ if (d < a || d > b) continue; if (d < n.date) continue; return [d,tm]; }
  return null;
}
function upcoming(e){ const n = now(); return e.occ.some(([d]) => d >= n.date); }
function base(e, skip={}){
  if (!skip.cats && state.cats.size && !state.cats.has(e.cat)) return false;
  if (!skip.price){
    if (state.free && e.priceMin !== 0) return false;
    if (state.max != null && !(e.priceMin != null && e.priceMin <= state.max)) return false;
  }
  if (state.avail && e.soldOut) return false;
  if (!skip.venue && state.venue && e.venue !== state.venue) return false;
  if (state.mine && !favs.has(e.id)) return false;
  return true;
}
function rows(skip={}, r=range()){
  const out = [];
  for (const e of EV){ if (!base(e, skip)) continue; const f = firstIn(e, r[0], r[1]); if (f) out.push({ e, d:f[0], t:f[1] }); }
  out.sort((x,y) => x.d < y.d ? -1 : x.d > y.d ? 1 : (x.t||"99") < (y.t||"99") ? -1 : 1);
  return out;
}

/* ── liquid lens ── */
function placeLens(group, btn, squish=true){
  const lens = group.querySelector(".lens"); if (!lens) return;
  if (!btn){ lens.style.opacity = 0; return; }
  lens.style.opacity = 1;
  const gr = group.getBoundingClientRect(), br = btn.getBoundingClientRect();
  lens.style.left = (br.left - gr.left) + "px"; lens.style.width = br.width + "px";
  if (squish && !REDUCE){ lens.classList.remove("go"); void lens.offsetWidth; lens.classList.add("go"); }
}

/* ── render: hero ── */
function renderHero(){
  const n = now();
  const h = +n.hh, part = h < 5 ? "natt" : h < 11 ? "morgen" : h < 17 ? "ettermiddag" : "kveld";
  $("#clock").textContent = `${cap(WD[wday(n.date)])} ${dnum(n.date)}. ${MO[+n.date.slice(5,7)-1]} · ${n.hh}:${n.mm}`;
  const tonight = EV.filter(e => upcoming(e) && e.occ.some(([d,tm]) => d === n.date && (toMin(tm) ?? 0) >= n.min - 30));
  const tomorrow = EV.filter(e => e.occ.some(([d]) => d === add(n.date,1)));
  const word = { natt:"i natt", morgen:"i dag", ettermiddag:"i dag", kveld:"i kveld" }[part];
  const greet = { natt:"Sent ute?", morgen:"God morgen,", ettermiddag:"God ettermiddag,", kveld:"God kveld," }[part];
  const cnt = tonight.length;
  $("#greet").innerHTML = cnt ? `${greet} <em>${cnt} ${cnt===1?"ting skjer":"ting skjer"} ${word}.</em>` : `${greet} <em>${tomorrow.length} ting i morgen.</em>`;
  const week = rows({}, [n.date, add(n.date,6)]).length;
  $("#sub").innerHTML = `<b data-count="${week}">${week}</b> arrangementer de neste sju dagene, fra ${new Set(EV.filter(upcoming).map(e=>e.venue)).size} scener. Programmet sjekkes hver andre time.`;
  $("#tonightN").textContent = cnt || "";
  // next up
  let nx = null;
  for (const e of EV){ for (const [d,tm] of e.occ){ if (!tm) continue; const m = toMin(tm); const key = d + tm;
    if (d > n.date || (d === n.date && m > n.min)) { if (!nx || key < nx.key) nx = { e, d, tm, key }; break; } } }
  const el = $("#next");
  if (!nx){ el.hidden = true; return; }
  el.hidden = false; el.style.setProperty("--c", `var(--k-${nx.e.cat})`); el.dataset.id = nx.e.id;
  const mins = nx.d === n.date ? toMin(nx.tm) - n.min : null;
  const cd = mins != null ? (mins < 60 ? `om ${mins} min` : `om ${Math.floor(mins/60)} t ${mins%60} min`) : `${relLabel(nx.d,n.date)||dshort(nx.d)} kl. ${nx.tm}`;
  el.innerHTML = `<span class="glowb" aria-hidden="true"></span>
    <span class="lab"><span class="ctag" style="--c:var(--k-${nx.e.cat})">${ic(nx.e.cat)}Neste opp</span><span class="cd">${cd}</span></span>
    <h2>${esc(nx.e.title)}</h2>
    <span class="meta"><span><b>${nx.tm}</b> ${relLabel(nx.d,n.date)?.toLowerCase()||dshort(nx.d)}</span><span>${esc(nx.e.venue)}</span>${nx.e.priceTxt?`<span>${esc(nx.e.priceTxt)}</span>`:""}</span>
    <span class="go"><span class="ctag" style="--c:var(--muted)">${nx.e.soldOut?"Utsolgt":nx.e.few?"Få billetter igjen":"Trykk for detaljer"}</span><span class="cta">Se mer ${ARROW}</span></span>`;
}

/* ── render: pulse ── */
function renderPulse(){
  const n = now(), box = $("#days");
  const skipRange = { };
  let html = "";
  const counts = [];
  for (let i=0;i<14;i++){
    const d = add(n.date,i);
    const by = {}; let tot = 0;
    for (const e of EV){ if (!base(e, skipRange)) continue; if (e.occ.some(([x]) => x === d)) { by[e.cat] = (by[e.cat]||0)+1; tot++; } }
    counts.push([d,by,tot]);
  }
  const max = Math.max(4, ...counts.map(c=>c[2]));
  counts.forEach(([d,by,tot],i) => {
    const w = wday(d);
    const bars = CATORDER.filter(c=>by[c]).map(c => `<i style="height:${by[c]/max*100}%;background:var(--k-${c})"></i>`).join("");
    html += `<button class="day${w===5||w===6||w===0?" wknd":""}${i===0?" today":""}${i>=7?" more14":""}" type="button" data-d="${d}" aria-pressed="${state.day===d}" aria-label="${dlong(d)}: ${tot} arrangementer"><span class="wd">${i===0?"i dag":WD[w].slice(0,3)}</span><span class="bars">${bars}</span><span class="dn">${dnum(d)}</span><span class="cnt">${tot}</span></button>`;
  });
  box.innerHTML = html;
  $("#pulseNote").textContent = state.day ? "Trykk igjen for å gå tilbake" : "Fargene er kategoriene";
}

/* ── render: filters ── */
function catCounts(){ const r = range(); const c = {}; for (const e of EV){ if (!base(e,{cats:true})) continue; if (firstIn(e,r[0],r[1])) c[e.cat] = (c[e.cat]||0)+1; } return c; }
function chipsHtml(){
  const c = catCounts();
  return CATORDER.map(k => `<button class="chip" type="button" data-cat="${k}" style="--c:var(--k-${k})" aria-pressed="${state.cats.has(k)}" ${!c[k] && !state.cats.has(k) ? "disabled" : ""}><span class="ic">${ic(k)}</span>${CAT[k]}<span class="n">${c[k]||0}</span></button>`).join("");
}
const STEPS = [0,100,200,300,400,500,700,1000,null];
function renderFilters(){
  $("#mcats").innerHTML = chipsHtml();
  const r = range();
  const vc = {}; for (const e of EV){ if (!base(e,{venue:true})) continue; if (firstIn(e,r[0],r[1])) vc[e.venue] = (vc[e.venue]||0)+1; }
  let vs = Object.entries(vc).sort((a,b)=>b[1]-a[1]).slice(0,9);
  if (state.venue && !vs.some(v=>v[0]===state.venue)) vs.unshift([state.venue, vc[state.venue]||0]);
  const idx = state.max == null ? STEPS.length-1 : STEPS.indexOf(state.max);
  const jbUp = JB.filter(upcoming);
  const jbMin = Math.min(...jbUp.filter(e=>e.priceMin).map(e=>e.priceMin));
  const active = activeCount();
  $("#filters").innerHTML = `
    <div class="fhead"><h3>Filtrer</h3><button class="linkbtn" type="button" data-reset ${active?"":"hidden"}>Nullstill</button></div>
    <div class="fsec"><h4>Hva</h4><div class="cats">${chipsHtml()}</div></div>
    <div class="fsec"><h4>Pris</h4>
      <div class="pricev"><b id="pv">${state.free ? "Gratis" : state.max==null ? "Alle priser" : "Opp til " + state.max + " kr"}</b><span>${state.max==null&&!state.free?"også ukjent pris":""}</span></div>
      <input type="range" id="price" min="0" max="${STEPS.length-1}" step="1" value="${state.free?0:idx}" style="--p:${(state.free?0:idx)/(STEPS.length-1)*100}%" aria-label="Makspris">
      <div class="ticks"><span>Gratis</span><span>500</span><span>Alle</span></div>
    </div>
    <div class="fsec">
      <button class="tgl" type="button" data-t="avail" aria-pressed="${state.avail}"><span>Bare ledige billetter<small>Skjul utsolgte</small></span><span class="sw" aria-hidden="true"></span></button>
      <button class="tgl" type="button" data-t="mine" aria-pressed="${state.mine}"><span>Bare mine<small>${favs.size} lagret med ★</small></span><span class="sw" aria-hidden="true"></span></button>
    </div>
    <div class="fsec"><h4>Scener</h4><div class="venues">${vs.map(([v,n]) => `<button class="venue" type="button" data-v="${esc(v)}" aria-pressed="${state.venue===v}"><span>${esc(v)}</span><span>${n}</span></button>`).join("") || `<span class="cnt">Ingen scener med disse filtrene</span>`}</div></div>
    ${jbUp.length ? `<a class="jbtile glass" href="https://kaskjerda.no/julebord/"><span class="ic">${ic("julebord")}</span><span><b>${jbUp.length} julebord i Ålesund</b><small>Fra ${jbMin} kr · egen side</small></span></a>` : ""}`;
}
function activeCount(){ return state.cats.size + (state.max!=null||state.free?1:0) + (state.avail?1:0) + (state.venue?1:0) + (state.mine?1:0); }

/* ── render: list ── */
let firstRender = true;
function renderList(){
  const n = now(), r = rows(), list = $("#list");
  const titles = { ikveld:"I kveld", imorgen:"I morgen", helg:"Denne helgen", uke:"De neste 7 dagene", alt:"Hele programmet" };
  $("#lh").textContent = state.mine ? "Mine arrangementer" : state.day ? cap(dlong(state.day)) : titles[state.when];
  $("#lc").textContent = r.length ? `${r.length} ${r.length===1?"arrangement":"arrangementer"}` : "";
  // active chips
  const act = [];
  state.cats.forEach(c => act.push([`cat:${c}`, CAT[c]]));
  if (state.free) act.push(["price","Gratis"]); else if (state.max!=null) act.push(["price",`Til ${state.max} kr`]);
  if (state.avail) act.push(["avail","Ledige billetter"]);
  if (state.venue) act.push(["venue", state.venue]);
  if (state.mine) act.push(["mine","★ Mine"]);
  $("#active").innerHTML = act.map(([k,l]) => `<button class="ach" type="button" data-rm="${esc(k)}" aria-label="Fjern ${esc(l)}">${esc(l)}${X}</button>`).join("");
  if (!r.length){ list.innerHTML = emptyHtml(); return; }
  let html = "", cur = null, i = 0, grp = [];
  const flush = () => { if (!cur) return; const rl = relLabel(cur,n.date);
    html += `<section class="dsec"><h3 class="dhead glass"><span class="dd">${dnum(cur)}</span><span>${cap(WD[wday(cur)])}${rl?` <span class="rel">· ${rl}</span>`:""}</span><span class="c">${MO[+cur.slice(5,7)-1].slice(0,3)} · ${grp.length}</span></h3><div class="grid">${grp.join("")}</div></section>`; grp = []; };
  for (const x of r){ if (x.d !== cur){ flush(); cur = x.d; } grp.push(card(x, i++, n)); }
  flush();
  list.innerHTML = html;
  firstRender = false;
}
function card({e,d,t}, i, n){
  const isToday = d === n.date, m = toMin(t);
  let rel = "";
  if (isToday && m != null){ const diff = m - n.min; rel = diff > 0 && diff <= 120 ? `<span class="pill rel">om ${diff < 60 ? diff + " min" : Math.floor(diff/60) + " t " + (diff%60) + " min"}</span>` : diff <= 0 ? `<span class="pill past">startet ${t}</span>` : ""; }
  const extra = e.occ.filter(([x]) => x > d).length;
  const st = e.showSt[`${d}T${t}`];
  const sold = e.soldOut || st === "sold", few = !sold && (e.few || st === "few");
  const price = e.priceMin === 0 ? `<span class="price free">Gratis</span>` : e.priceTxt ? `<span class="price">${esc(e.priceTxt)}</span>` : `<span class="price unk">Pris hos arrangør</span>`;
  const isNew = e.addedAt && (Date.now() - Date.parse(e.addedAt)) < 4*864e5;
  return `<article class="card glass${sold?" isSold":""}${isToday && m!=null && m <= n.min ? " started":""}" style="--c:var(--k-${e.cat});--i:${Math.min(i,14)}" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.title)}, ${dlong(d)} ${t||""}">
    <span class="glowc" aria-hidden="true"></span><span class="edge" aria-hidden="true"></span>
    <div class="ctop"><span class="ctag">${ic(e.cat)}${CAT[e.cat]}${isNew?` <span class="new">Ny</span>`:""}</span><button class="star" type="button" data-star="${e.id}" aria-pressed="${favs.has(e.id)}" aria-label="Lagre i Mine">${STAR}</button></div>
    <div class="cmain"><div class="ctime"><b>${t || "–"}</b><span>${dshort(d).split(" ").slice(0,1)}</span></div>
      <div class="ctitle"><h3>${esc(e.title)}</h3><div class="v">${PIN}${esc(e.venue)}</div></div></div>
    <div class="cfoot">${price}${sold?`<span class="pill sold">Utsolgt</span>`:few?`<span class="pill few">Få igjen</span>`:""}${rel}${extra?`<span class="pill more">+${extra} ${extra===1?"dato":"datoer"}</span>`:""}</div>
  </article>`;
}
function emptyHtml(){
  // suggest the single change that gives most hits
  const tries = [];
  if (state.day || state.when !== "alt") tries.push(["Vis alle datoer", () => { state.day = null; state.when = "alt"; }, (() => { const s = {...state}; return rows({}, [now().date,"9999"]).length; })()]);
  if (state.cats.size) tries.push(["Alle kategorier", () => state.cats.clear(), rows({cats:true}).length]);
  if (state.max!=null || state.free) tries.push(["Alle priser", () => { state.max = null; state.free = false; }, rows({price:true}).length]);
  if (state.venue) tries.push(["Alle scener", () => state.venue = null, rows({venue:true}).length]);
  const best = tries.filter(t=>t[2]>0).sort((a,b)=>b[2]-a[2])[0];
  emptyFix = best ? best[1] : null;
  return `<div class="empty glass"><div class="orb" aria-hidden="true"></div><h3>${state.mine && !favs.size ? "Ingen lagret ennå" : "Stille her akkurat nå"}</h3>
    <p>${state.mine && !favs.size ? "Trykk ★ på et arrangement, så havner det her." : best ? `Men ${best[2]} ting dukker opp hvis du velger «${best[0].toLowerCase()}».` : "Prøv et annet filter."}</p>
    <div class="acts">${best?`<button class="cta" type="button" data-fix>${best[0]} · ${best[2]}</button>`:""}${activeCount()>1?`<button class="ghost" type="button" data-reset>Nullstill alt</button>`:""}</div></div>`;
}
let emptyFix = null;

/* ── full render with transition ── */
function syncControls(){
  const wb = [...document.querySelectorAll("#when button")];
  wb.forEach(b => b.setAttribute("aria-pressed", !state.day && b.dataset.w === state.when));
  placeLens($("#when"), wb.find(b => b.getAttribute("aria-pressed")==="true"));
  const tab = state.mine ? "mine" : (!state.day && state.when==="ikveld") ? "ikveld" : "utforsk";
  const tb = [...document.querySelectorAll("#tabbar .tab")];
  tb.forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  placeLens($("#tabbar"), tb.find(b => b.dataset.tab === tab));
  $("#mineN").textContent = favs.size; $("#mineBadge").textContent = favs.size || "";
  $("#mineTop").setAttribute("aria-pressed", state.mine);
  $("#filtN").textContent = activeCount() || "";
}
function render(animate=true){
  const go = () => { renderPulse(); renderFilters(); renderList(); syncControls(); mood.target(); };
  if (animate && !REDUCE && document.startViewTransition && !firstRender) document.startViewTransition(go);

/* ── detail sheet ── */

      <div class="fact"><small>Når</small><b>${cap(dshort(first[0]))}${first[1]?` kl. ${first[1]}`:""}</b></div>
      <div class="fact"><small>Pris</small><b>${esc(priceTxt)}</b>${e.soldOut?`<div><span class="pill sold">Utsolgt</span></div>`:e.few?`<div><span class="pill few">Få billetter igjen</span></div>`:""}</div>
      <div class="fact wide"><small>Hvor</small><b>${esc(e.venue)}</b>${e.address?`<div class="cnt">${esc(e.address)}</div>`:""}<a href="${map}" target="_blank" rel="noopener">Vis på kart ↗</a></div>
      ${occ.length > 1 ? `<div class="fact wide"><small>${occ.length} forestillinger</small><div class="shows">${shows}</div></div>` : ""}
    </div>
    ${e.note ? `<p class="dnote">${esc(e.note)}</p>` : ""}
    <p class="srcline">Fra arrangørens side. Sjekk alltid hos arrangøren før du kjøper billett.</p></div>`;
  $("#sfoot").innerHTML = `<button class="ghost" type="button" data-star="${e.id}" aria-pressed="${favs.has(e.id)}" aria-label="Lagre i Mine">${STAR}</button><button class="ghost" type="button" data-copy="${esc(e.url||"")}">Kopier lenke</button>${e.url?`<a class="cta" href="${esc(e.url)}" target="_blank" rel="noopener">${e.soldOut?"Se hos arrangør":"Billetter"} ${ARROW}</a>`:""}`;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  $("#sbody").scrollTop = 0;
}
function closeAll(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); $("#spot").classList.remove("on"); openId = null; }

/* drag sheet down to close (phone) */
(() => { const sh = $("#sheet"), gr = $("#grab"); let y0 = null, dy = 0;
  gr.addEventListener("pointerdown", ev => { y0 = ev.clientY; dy = 0; sh.classList.add("drag"); gr.setPointerCapture(ev.pointerId); });
  gr.addEventListener("pointermove", ev => { if (y0 == null) return; dy = Math.max(0, ev.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; sh.classList.remove("drag"); sh.style.transform = ""; if (dy > 90) closeAll(); y0 = null; };
  gr.addEventListener("pointerup", end); gr.addEventListener("pointercancel", end);
})();

/* ── favourites with a flying star ── */
function toggleFav(id, btn){
  const on = !favs.has(id);
  on ? favs.add(id) : favs.delete(id); store.set("glass-favs", [...favs]);
  document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b => b.setAttribute("aria-pressed", on));
  if (btn && !REDUCE){ btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
  if (on && btn && !REDUCE) flyStar(btn);
  toast(on ? "Lagt i ★ Mine" : "Fjernet fra Mine");
  syncControls();
  if (state.mine) render();
  else renderFilters();
}
function flyStar(from){
  const stage = $("#stage").getBoundingClientRect();
  const wide = $("#scroller").clientWidth >= 900;
  const to = wide ? $("#mineTop") : document.querySelector('#tabbar [data-tab="mine"]');
  if (!to) return;
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  const f = document.createElement("div"); f.className = "fly"; f.innerHTML = STAR;
  f.style.left = (a.left - stage.left + a.width/2 - 11) + "px"; f.style.top = (a.top - stage.top + a.height/2 - 11) + "px";
  $("#stage").appendChild(f);
  const dx = b.left + b.width/2 - a.left - a.width/2, dy = b.top + b.height/2 - a.top - a.height/2;
  f.animate([{ transform:"translate(0,0) scale(1)" },{ transform:`translate(${dx*.5}px,${dy*.5 - 80}px) scale(1.6) rotate(140deg)` },{ transform:`translate(${dx}px,${dy}px) scale(.5) rotate(300deg)`, opacity:.3 }], { duration:700, easing:"cubic-bezier(.5,0,.4,1)" }).onfinish = () => { f.remove(); to.classList.remove("bump"); void to.offsetWidth; to.classList.add("bump"); };
}
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }

/* ── search (folded ø/æ/å, accents, the note too, small synonym list) ── */
const SYN = { nutcracker:"notteknekker", christmas:"jul", comedy:"standup", "stand up":"standup", concert:"konsert", kids:"barn", family:"barn", football:"aalesund", fotball:"aalesund", aafk:"aalesund" };
function openSearch(){ $("#spot").classList.add("on"); $("#scrim").classList.add("on"); $("#q").value = ""; runSearch(); setTimeout(() => $("#q").focus(), 60); }
function runSearch(){
  const raw = $("#q").value.trim(); let q = fold(raw);
  Object.entries(SYN).forEach(([k,v]) => { if (q.includes(k)) q = q.replace(k, v); });
  const box = $("#sres");
  if (!q){
    const pop = ["Juleshow","Standup","Quiz","Parken","Terminalen","Gratis","Barn","AaFK"];
    box.innerHTML = `<div class="shint">Forslag</div><div class="sugs">${pop.map(p=>`<button class="sug" type="button" data-sug="${p}">${p}</button>`).join("")}</div><div class="shint">Neste opp</div>` + EV.filter(upcoming).slice().sort((a,b)=> (a.occ.find(o=>o[0]>=now().date)||[""])[0] < (b.occ.find(o=>o[0]>=now().date)||[""])[0] ? -1 : 1).slice(0,6).map(e => srow(e)).join("");
    return;
  }
  const words = q.split(/\s+/);
  const hits = EV.filter(e => upcoming(e) && (words.every(w => e.search.includes(w)) || (q === "gratis" && e.priceMin === 0)));
  box.innerHTML = hits.length ? `<div class="shint">${hits.length} treff</div>` + hits.slice(0,40).map(e => srow(e, raw)).join("") : `<div class="snone">Fant ingenting på «${esc(raw)}». Prøv et artistnavn, en scene eller «quiz».</div>`;
}
function srow(e, raw){
  const n = now(); const o = e.occ.find(([d]) => d >= n.date) || e.occ[0];
  let t = esc(e.title);
  if (raw){ const i = fold(e.title).indexOf(fold(raw)); if (i >= 0 && fold(e.title).length === e.title.length) t = esc(e.title.slice(0,i)) + "<mark>" + esc(e.title.slice(i, i+raw.length)) + "</mark>" + esc(e.title.slice(i+raw.length)); }
  return `<button class="srow" type="button" data-open="${e.id}" style="--c:var(--k-${e.cat})"><span class="ic">${ic(e.cat)}</span><span><b>${t}</b><small>${esc(e.venue)}</small></span><em>${relLabel(o[0],n.date)||dshort(o[0])}</em></button>`;
}

/* ── mood background: soft fields in the colours of what you are looking at ── */
const mood = (() => {
  const cv = $("#mood"), ctx = cv.getContext("2d");
  let W=0,H=0, blobs = [], raf = null, last = 0;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const hex = h => { h = h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
  function size(){ const r = cv.getBoundingClientRect(); W = cv.width = Math.max(1, Math.round(r.width/3)); H = cv.height = Math.max(1, Math.round(r.height/3)); }
  function target(){
    const r = rows(); const c = {}; r.forEach(x => c[x.e.cat] = (c[x.e.cat]||0)+1);
    let list = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if (!list.length) list = [["konsert",1],["show",1]];
    const tot = list.reduce((s,x)=>s+x[1],0);
    const cols = list.map(([k,v]) => ({ rgb:hex(css("--k-"+k)), w: .45 + .55*v/tot }));
    while (cols.length < 5) cols.push({ ...cols[cols.length % list.length], w:cols[0].w*.6 });
    cols.forEach((col,i) => { const b = blobs[i] || (blobs[i] = { x:Math.random(), y:Math.random()*.8, vx:(Math.random()-.5)*.00012, vy:(Math.random()-.5)*.0001, rgb:col.rgb.slice(), r:.3 });
      b.to = col.rgb; b.rt = .22 + col.w*.28; });
    if (REDUCE) draw(0);
  }
  function draw(dt){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    for (const b of blobs){
      for (let k=0;k<3;k++) b.rgb[k] += (b.to[k]-b.rgb[k]) * Math.min(1, dt*.0025);
      b.r += (b.rt - b.r) * Math.min(1, dt*.002);
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.x < -.1 || b.x > 1.1) b.vx *= -1; if (b.y < -.1 || b.y > 1) b.vy *= -1;
      const R = b.r * Math.max(W,H) * 1.1, g = ctx.createRadialGradient(b.x*W, b.y*H, 0, b.x*W, b.y*H, R);
      const [r,gg,bb] = b.rgb.map(Math.round);
      g.addColorStop(0, `rgba(${r},${gg},${bb},.55)`); g.addColorStop(.5, `rgba(${r},${gg},${bb},.18)`); g.addColorStop(1, `rgba(${r},${gg},${bb},0)`);
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    }
  }
  function loop(t){ const dt = Math.min(64, t - (last||t)); last = t; draw(dt); raf = requestAnimationFrame(loop); }
  function start(){ size(); target(); if (REDUCE){ blobs.forEach(b=>{b.rgb=b.to.slice(); b.r=b.rt;}); draw(0); return; } cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(loop); }
  addEventListener("resize", () => { size(); if (REDUCE) draw(0); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else if (!REDUCE){ last = 0; raf = requestAnimationFrame(loop); } });
  return { start, target, size };
})();

/* ── events ── */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, a, [data-id]"); if (!t) return;
  if (t.dataset.star){ ev.stopPropagation(); toggleFav(t.dataset.star, t); return; }
  if (t.dataset.w){ state.when = t.dataset.w; state.day = null; state.mine = false; render(); return; }
  if (t.dataset.d){ state.day = state.day === t.dataset.d ? null : t.dataset.d; render(); scrollToList(); return; }
  if (t.dataset.cat){ state.cats.has(t.dataset.cat) ? state.cats.delete(t.dataset.cat) : state.cats.add(t.dataset.cat); render(); return; }
  if (t.dataset.v){ state.venue = state.venue === t.dataset.v ? null : t.dataset.v; render(); return; }
  if (t.dataset.t){ state[t.dataset.t] = !state[t.dataset.t]; render(); return; }
  if (t.dataset.rm){ const k = t.dataset.rm; if (k.startsWith("cat:")) state.cats.delete(k.slice(4)); else if (k==="price"){ state.max=null; state.free=false; } else state[k] = k==="venue" ? null : false; render(); return; }
  if ("reset" in t.dataset){ state.cats.clear(); state.max=null; state.free=false; state.avail=false; state.venue=null; state.mine=false; render(); return; }
  if ("fix" in t.dataset){ emptyFix && emptyFix(); render(); return; }
  if (t.dataset.tab){ const k = t.dataset.tab;
    if (k === "filter"){ openFilterSheet(); return; }
    state.mine = k === "mine"; state.day = null; if (k === "ikveld") state.when = "ikveld"; else if (k === "utforsk" && state.when === "ikveld") state.when = "uke";
    render(); $("#scroller").scrollTo({ top: 0 }); return; }
  if (t.id === "mineTop"){ state.mine = !state.mine; render(); return; }
  if (t.id === "orb" || t.id === "openSearch"){ openSearch(); return; }
  if (t.id === "closeSearch"){ closeAll(); return; }
  if (t.dataset.sug){ $("#q").value = t.dataset.sug; runSearch(); return; }
  if (t.dataset.open){ $("#spot").classList.remove("on"); openDetail(t.dataset.open); return; }
  if (t.dataset.copy != null){ const u = t.dataset.copy; (navigator.clipboard?.writeText(u) || Promise.reject()).then(() => toast("Lenken er kopiert"), () => toast(u)); return; }
  if (t.id === "themeBtn"){ const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; store.set("glass-theme", r.dataset.theme); setTimeout(() => mood.target(), 30); return; }
  if (t.dataset.pv){ setPreview(t.dataset.pv); return; }
  if (t.id === "next" || t.dataset.id){ openDetail(t.dataset.id); return; }
});
$("#scrim").addEventListener("click", closeAll);
document.addEventListener("keydown", ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); openSearch(); }
  else if (ev.key === "Escape") closeAll();
  else if (ev.key === "Enter" && ev.target.matches?.(".card")) openDetail(ev.target.dataset.id);
});
$("#q").addEventListener("input", runSearch);
document.addEventListener("input", ev => { if (ev.target.id !== "price") return;
  const i = +ev.target.value; state.free = i === 0; state.max = i === 0 || i === STEPS.length-1 ? null : STEPS[i];
  ev.target.style.setProperty("--p", i/(STEPS.length-1)*100 + "%");
  $("#pv").textContent = state.free ? "Gratis" : state.max==null ? "Alle priser" : "Opp til " + state.max + " kr";
  clearTimeout(window.__pt); window.__pt = setTimeout(() => { renderList(); renderPulse(); syncControls(); mood.target(); $("#mcats").innerHTML = chipsHtml(); }, 120);
});
// specular light follows the pointer on cards
document.addEventListener("pointermove", ev => { const c = ev.target.closest?.(".card"); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty("--mx", (ev.clientX-r.left)+"px"); c.style.setProperty("--my", (ev.clientY-r.top)+"px"); }, { passive:true });

function openFilterSheet(){
  // the filter panel is reused inside the sheet on phones
  const f = $("#filters");
  $("#sbody").innerHTML = ""; $("#sbody").appendChild(f); f.style.display = "block"; f.classList.remove("glass"); f.style.padding = "0";
  const n = rows().length;
  $("#sfoot").innerHTML = `<button class="cta" type="button" id="showN">Vis ${n} ${n===1?"arrangement":"arrangementer"}</button>`;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); openId = "filter";
}
const _render = render;
// keep the filter sheet's button count fresh
const obs = new MutationObserver(() => { const b = $("#showN"); if (b){ const n = rows().length; b.textContent = `Vis ${n} ${n===1?"arrangement":"arrangementer"}`; } });
obs.observe($("#list"), { childList:true });
document.addEventListener("click", ev => { if (ev.target.closest("#showN")){ closeAll(); scrollToList(); } });
const _close = closeAll;
function restoreFilters(){ const f = $("#filters"); if (f.parentElement !== $(".side")){ $(".side").appendChild(f); f.style.display = ""; f.style.padding = ""; f.classList.add("glass"); } }
$("#scrim").addEventListener("click", restoreFilters);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") restoreFilters(); });
new MutationObserver(() => { if (!$("#sheet").classList.contains("on")) setTimeout(restoreFilters, 400); }).observe($("#sheet"), { attributes:true, attributeFilter:["class"] });

function scrollToList(){ const el = $(".listhead"); const s = $("#scroller"); s.scrollTo({ top: el.getBoundingClientRect().top - s.getBoundingClientRect().top + s.scrollTop - stickH() + 4 }); }
function stickH(){ return $("#top").offsetHeight + 8; }
new ResizeObserver(() => { document.documentElement.style.setProperty("--stick", stickH() + "px"); syncControls(); }).observe($("#top"));

/* ── preview: PC / Mobil ── */
function setPreview(m){
  document.body.classList.toggle("phone", m === "mobil");
  document.querySelectorAll("#pvbar button").forEach(b => b.setAttribute("aria-pressed", b.dataset.pv === m));
  try{ history.replaceState(null, "", m === "mobil" ? "#mobil" : "#pc"); }catch(e){}
  setTimeout(() => { mood.size(); syncControls(); }, 60);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* boot */
const th = store.get("glass-theme", null); if (th) document.documentElement.dataset.theme = th;
setPreview(location.hash === "#mobil" ? "mobil" : "pc");
const n0 = now(); if (n0.min >= 16*60 && rows({}, [n0.date,n0.date]).some(x => (toMin(x.t)||0) > n0.min)) state.when = "uke";
render(false); renderHero(); mood.start();
setInterval(() => { renderHero(); if (!openId) renderList(); }, 60000);
addEventListener("hashchange", () => setPreview(location.hash === "#mobil" ? "mobil" : "pc"));
})();
</script>
